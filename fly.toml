app = "openclaw-academy"
primary_region = "syd"

[build]

[env]
  COURSE_DIR = "/app/course"
  DB_PATH = "/data/progress.db"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "academy_data"
  destination = "/data"
